<!-- app/templates/load_alert.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f6f8; padding: 20px; }
        .card { max-width: 600px; margin: auto; background: #ffffff; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge { background: #e53e3e; color: #ffffff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .field-group { margin-bottom: 15px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
        .label { font-size: 12px; color: #718096; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 16px; color: #2d3748; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div><span class="badge">HOT LEAD</span></div>
        <h2 style="color: #1a202c; margin-top: 10px;">{{ lead.form_title }}</h2>
        
        <div class="field-group">
            <div class="label">Prospect Name</div>
            <div class="value">{{ lead.lead_name }}</div>
        </div>
        <div class="field-group">
            <div class="label">Email Address</div>
            <div class="value">{{ lead.lead_email or 'Not Provided' }}</div>
        </div>
        <div class="field-group">
            <div class="label">Phone Number</div>
            <div class="value">{{ lead.lead_phone or 'Not Provided' }}</div>
        </div>
        <div class="field-group">
            <div class="label">Message / Notes</div>
            <div class="value">{{ lead.message }}</div>
        </div>
    </div>
</body>
</html>
